name: Publish F1 发车线

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .live-cache
          key: f1-live-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: f1-live-v1-
      - name: Prepare the public site and data snapshots
        run: python3 scripts/build-mirror.py
      - name: Add the live centre and refresh news and video
        run: node scripts/build-live.mjs
      - name: Check the mobile cover once per session
        id: mobile_photo
        continue-on-error: true
        run: |
          pending="$(node scripts/check-home-photo.mjs --pending)"
          if [ "$pending" = true ]; then
            npm install --prefix "$RUNNER_TEMP/f1-photo" --no-save playwright@1.62.1
            export F1_PLAYWRIGHT="$RUNNER_TEMP/f1-photo/node_modules/playwright"
            export F1_CHROME="$(command -v google-chrome || true)"
            if [ -z "$F1_CHROME" ]; then
              "$RUNNER_TEMP/f1-photo/node_modules/.bin/playwright" install --with-deps chromium
            fi
            node scripts/check-home-photo.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: steps.mobile_photo.outcome == 'failure'
        with:
          name: home-photo-diagnostics
          path: home-photo-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.final_attempt.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        continue-on-error: true
      - name: Wait before retrying Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - uses: actions/deploy-pages@v5.0.1
        id: retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
      - name: Wait for the final Pages attempt
        if: steps.retry.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v5.0.1
        id: final_attempt
        if: steps.retry.outcome == 'failure'
