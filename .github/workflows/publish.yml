name: Publish F1 发车线

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .live-cache
          key: f1-live-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: f1-live-v1-
      - name: Prepare the public site and data snapshots
        run: python3 scripts/build-mirror.py
      - name: Add the live centre and refresh news and video
        run: node scripts/build-live.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
